name: android

on:
  push:
  workflow_dispatch:
    inputs:
      publish_cache:
        description: "Publish the Gradle dependency cache as a release asset"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - uses: actions/cache@v4
        with:
          path: mobile/native/android/build
          key: native-${{ hashFiles('mobile/native/**/*.json', 'mobile/native/android/*.cpp', 'mobile/native/android/*.h', 'mobile/native/android/*.sh', 'mobile/native/android/*.py', 'mobile/native/android/CMakeLists.txt') }}
      - name: Build native runtimes
        run: NATIVE_JOBS=4 bash ../native/android/build.sh
      - name: Assemble, test and lint
        run: ./gradlew --console=plain assembleDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: mobile/android/**/build/reports/tests/
          if-no-files-found: ignore
      - name: Publish Gradle dependency cache
        if: ${{ github.event_name == 'push' || inputs.publish_cache }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --stop
          tar -C "$HOME/.gradle/caches" -cf - modules-2 | zstd -T0 -10 -o "$RUNNER_TEMP/gradle-modules-2.tar.zst"
          gh release view ci-gradle-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create ci-gradle-cache --repo "$GITHUB_REPOSITORY" --prerelease --title "CI Gradle dependency cache" --notes "Gradle read-only dependency cache (modules-2) for offline builds. Not an app release." --target "$GITHUB_SHA"
          gh release upload ci-gradle-cache "$RUNNER_TEMP/gradle-modules-2.tar.zst" --repo "$GITHUB_REPOSITORY" --clobber
