name: android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_CMAKE_VERSION: 3.22.1
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile/android
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - uses: actions/cache@v4
        with:
          path: mobile/native/android/build
          key: native-${{ hashFiles('mobile/native/**/*.json', 'mobile/native/android/*.cpp', 'mobile/native/android/*.h', 'mobile/native/android/*.sh', 'mobile/native/android/*.py', 'mobile/native/android/CMakeLists.txt') }}
      - name: Build native runtimes
        run: NATIVE_JOBS=4 bash ../native/android/build.sh
      - name: Unit tests, debug APKs, instrumentation APK and release bundle
        run: ./gradlew --console=plain -PvoziaBuild=$BUILD_NUMBER testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease
      - name: Collect outputs
        run: |
          mkdir -p "$RUNNER_TEMP/dist/update"
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk "$RUNNER_TEMP/dist/"
          # An update build (versionCode + 1000) for the install-over test on the device.
          ./gradlew --console=plain -PvoziaBuild=$((BUILD_NUMBER + 1000)) assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/dist/update/"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP"/dist/app-*-debug.apk "$RUNNER_TEMP/release/"
          for f in "$RUNNER_TEMP"/release/app-*-debug.apk; do mv "$f" "${f/app-/VoiceStudio-VozIA-$BUILD_NUMBER-}"; done
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/release/VoiceStudio-VozIA-$BUILD_NUMBER-release-unsigned.aab"
          (cd "$RUNNER_TEMP/release" && sha256sum * > SHA256SUMS.txt)
          ls -la "$RUNNER_TEMP/dist" "$RUNNER_TEMP/release"
      - name: Signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.VOZIA_KEYSTORE_BASE64 }}
          VOZIA_KEYSTORE_PASSWORD: ${{ secrets.VOZIA_KEYSTORE_PASSWORD }}
          VOZIA_KEY_ALIAS: ${{ secrets.VOZIA_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          VOZIA_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew --console=plain -PvoziaBuild=$BUILD_NUMBER assembleRelease bundleRelease
          for f in app/build/outputs/apk/release/app-*-release.apk; do b=$(basename "$f"); cp "$f" "$RUNNER_TEMP/release/VoiceStudio-VozIA-$BUILD_NUMBER-${b#app-}"; done
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release/VoiceStudio-VozIA-$BUILD_NUMBER-release.aab"
          rm -f "$RUNNER_TEMP"/release/*-release-unsigned.aab "$RUNNER_TEMP/release.jks"
          (cd "$RUNNER_TEMP/release" && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: mobile/android/**/build/reports/tests/
          if-no-files-found: ignore
      - name: Publish build
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$BUILD_NUMBER"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "Debug-signed APKs built by CI from commit ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`."
            echo
            echo "- \`*-arm64-v8a-debug.apk\`: most phones (64-bit ARM)"
            echo "- \`*-universal-debug.apk\`: any supported device (arm64 + x86_64)"
            echo "- \`*-x86_64-debug.apk\`: emulators and x86_64 devices"
            echo "- \`*-release-unsigned.aab\`: Android App Bundle (sign with your upload key before Play)"
            echo
            echo "Device test results for this build are attached as \`device-results-*.zip\` when the emulator jobs finish."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "VoiceStudio VozIA build $BUILD_NUMBER" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/release/*
      - name: Publish Gradle dependency cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --stop
          tar -C "$HOME/.gradle/caches" -cf - modules-2 | zstd -T0 -10 -o "$RUNNER_TEMP/gradle-modules-2.tar.zst"
          gh release view ci-gradle-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create ci-gradle-cache --repo "$GITHUB_REPOSITORY" --prerelease --title "CI Gradle dependency cache" --notes "Gradle read-only dependency cache (modules-2) for offline builds. Not an app release." --target "$GITHUB_SHA"
          gh release upload ci-gradle-cache "$RUNNER_TEMP/gradle-modules-2.tar.zst" --repo "$GITHUB_REPOSITORY" --clobber

  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api34-phone
            api: 34
            target: google_apis
            profile: pixel_6
            full: "true"
          - name: api29-phone
            api: 29
            target: default
            profile: pixel_3a
            full: "false"
          - name: api35-tablet
            api: 35
            target: google_apis
            profile: pixel_tablet
            full: "false"
          - name: api34-heavy-models
            api: 34
            target: google_apis
            profile: pixel_6
            full: heavy
            ram: 8192M
            disk: 16G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run end-to-end checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram || '4096M' }}
          disk-size: ${{ matrix.disk || '8G' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash mobile/android/scripts/device-e2e.sh dist device-results ${{ matrix.full }}
      - name: Show summary
        if: always()
        run: cat device-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results-${{ matrix.name }}
          path: device-results
      - name: Attach results to the build release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd device-results && zip -qr "../device-results-${{ matrix.name }}.zip" .)
          gh release upload "${{ needs.build.outputs.tag }}" "device-results-${{ matrix.name }}.zip" --repo "$GITHUB_REPOSITORY" --clobber
